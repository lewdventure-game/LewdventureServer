name: lewdventure-analytics

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      TZ: UTC
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/lewdventure-users.xml:ro
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/lewdventure-low-memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user admin --password \"$$CLICKHOUSE_ADMIN_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      analytics:
        aliases:
          - lewdventure-clickhouse
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  clickhouse-schema:
    image: clickhouse/clickhouse-server:25.8
    restart: "no"
    env_file:
      - .env
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/schema.sql:/opt/lewdventure/schema.sql:ro
    entrypoint:
      - bash
      - -c
      - clickhouse-client --host clickhouse --user admin --password "$$CLICKHOUSE_ADMIN_PASSWORD" --multiquery < /opt/lewdventure/schema.sql
    networks:
      - analytics

  grafana:
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_SERVER_ROOT_URL: https://${ADMIN_DOMAIN:?}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://${ADMIN_DOMAIN:?}/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: system
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource
      GF_LOG_LEVEL: warn
      TZ: UTC
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      analytics: {}
      grafana:
        aliases:
          - lewdventure-grafana
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  analytics:
    external: true
    name: lewdventure-analytics
  grafana:
    external: true
    name: lewdventure-grafana

volumes:
  clickhouse-data: {}
  grafana-data: {}
