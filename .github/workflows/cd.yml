name: cd

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: metadata
        id: meta
        run: |
          {
            echo "image_tag=sha-${GITHUB_SHA::12}"
            echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push api
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta.outputs.registry }}/lewdventure-server:${{ steps.meta.outputs.image_tag }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.title=lewdventure-server
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=lewdventure
          cache-to: type=gha,mode=max,scope=lewdventure

      - name: build and push config-tool
        id: tool
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: config-tool
          push: true
          tags: ${{ steps.meta.outputs.registry }}/lewdventure-config-tool:${{ steps.meta.outputs.image_tag }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.title=lewdventure-config-tool
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=lewdventure

      - name: summary
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          TOOL_DIGEST: ${{ steps.tool.outputs.digest }}
        run: |
          {
            echo "### Images"
            echo "- \`lewdventure-server:$IMAGE_TAG\` \`$API_DIGEST\`"
            echo "- \`lewdventure-config-tool:$IMAGE_TAG\` \`$TOOL_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
