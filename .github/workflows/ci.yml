name: ci

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: restore
        run: dotnet restore LewdventureServer.slnx --locked-mode
      - name: build
        run: dotnet build LewdventureServer.slnx -c Release --no-restore
      - name: format
        run: dotnet format whitespace LewdventureServer.slnx --verify-no-changes --no-restore
      - name: unit tests
        run: dotnet test tests/Lewdventure.Server.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: golden tests
        run: dotnet test tests/Lewdventure.Server.GoldenTests -c Release --no-build --logger "trx;LogFileName=golden.trx" --results-directory TestResults
      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            tests/**/TestResults/golden-diff
          if-no-files-found: ignore
      - name: vulnerable packages
        run: |
          dotnet list LewdventureServer.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE "\b(High|Critical)\b" vulnerable.txt; then exit 1; fi

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: restore
        run: dotnet restore LewdventureServer.slnx --locked-mode
      - name: build
        run: dotnet build tests/Lewdventure.Server.IntegrationTests -c Release --no-restore
      - name: integration tests
        env:
          LEWD_IT_ENABLED: "1"
        run: dotnet test tests/Lewdventure.Server.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: start stack
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.ci.yaml up -d --build --wait --wait-timeout 300
      - name: readiness
        run: curl -fsS http://127.0.0.1:9090/health/ready
      - name: replay matches golden
        run: |
          case_dir=tests/Lewdventure.Server.GoldenTests/Golden/Cases/019-full-perk-kit
          jq -c '. + {seed: 1337}' "$case_dir/request.json" > replay.json
          curl -fsS -X POST http://127.0.0.1:5000/api/battle/replay -H 'Content-Type: application/json' --data-binary @replay.json -o replay.out
          cmp replay.out "$case_dir/seed-1337.response.json"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: load smoke
        run: dotnet run -c Release --project tools/Lewdventure.Server.LoadTest -- --target http://127.0.0.1:5000 --concurrency 8 --duration 15 --warmup 3 --max-error-rate 0
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.ci.yaml logs --no-color
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: lewdventure-server:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: stop stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.ci.yaml down -v

